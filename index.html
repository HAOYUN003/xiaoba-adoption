<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小八 · 领养守护官</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#03040a;color:#eaf2ff;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;user-select:none;}
#wrap{height:100%;display:flex;flex-direction:column;}
#appbar{position:relative;flex:none;height:58px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:linear-gradient(180deg,rgba(8,10,24,.94),rgba(8,10,24,.62));
  border-bottom:1px solid rgba(120,190,255,.22);backdrop-filter:blur(8px);z-index:30;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:34px;height:34px;border-radius:10px;flex:none;
  background:radial-gradient(circle at 30% 25%,#7fe0ff,#2f6fe0 60%,#1a2f78);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;
  box-shadow:0 0 16px rgba(80,160,255,.7),inset 0 0 8px rgba(255,255,255,.25);}
.brand .t{font-weight:700;letter-spacing:2px;font-size:16px;text-shadow:0 0 12px rgba(120,200,255,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand .t small{display:block;font-size:9px;letter-spacing:3px;color:#6f86c8;font-weight:500;}
#hud{display:flex;align-items:center;gap:10px;flex:none;}
#affinity{min-width:196px;background:rgba(10,14,30,.72);border:1px solid rgba(120,190,255,.28);
  border-radius:14px;padding:7px 12px;box-shadow:0 4px 18px rgba(0,0,0,.5);}
#affinity .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
#affinity .lbl{font-size:11px;color:#9fb4ff;letter-spacing:2px;}
#affinity .val{font-weight:800;color:#7bffc0;font-size:15px;text-shadow:0 0 10px rgba(80,255,180,.5);}
#affinity .lv{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;
  background:linear-gradient(135deg,#2f9bff,#7b5cff);color:#fff;box-shadow:0 0 10px rgba(90,140,255,.6);}
#affinity .bar{height:4px;margin-top:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;}
#affinity .bar i{display:block;height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,#31e0a0,#7bffc0);
  box-shadow:0 0 8px rgba(80,255,180,.8);}
#aud{width:40px;height:40px;border-radius:12px;border:1px solid rgba(120,190,255,.3);
  background:rgba(10,14,30,.72);color:#cfdaff;font-size:17px;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.5);}
#aud.off{opacity:.5;}
#keyBtn{width:auto;padding:0 12px;height:40px;border-radius:12px;border:1px solid rgba(120,190,255,.3);
  background:rgba(10,14,30,.72);color:#cfdaff;font-size:13px;font-weight:700;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.5);gap:4px;}
#keyBtn.on{border-color:rgba(123,255,192,.7);color:#7bffc0;background:rgba(10,30,20,.72);}
#keyBtn:active{transform:scale(.96);}
#wasdHint{position:fixed;left:16px;bottom:180px;z-index:60;color:#cfe3c0;font-size:11px;letter-spacing:1px;
  background:rgba(10,20,16,.55);padding:6px 12px;border-radius:8px;opacity:.85;pointer-events:none;transition:opacity .4s;}
#wasdHint.hide{opacity:0;}
#dpad{position:fixed;left:16px;bottom:16px;z-index:200;width:150px;height:150px;
  grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px 50px;gap:0;display:none;pointer-events:auto;}
#dpad.show{display:grid;}
#dpad button{width:50px;height:50px;background:rgba(10,20,16,.55);border:1px solid rgba(120,190,255,.25);
  color:#cfe3c0;font-size:18px;font-weight:800;cursor:pointer;border-radius:8px;
  display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;}
#dpad button:active{background:rgba(123,255,192,.35);color:#7bffc0;}
#dpad .pU{grid-column:2;grid-row:1;}#dpad .pL{grid-column:1;grid-row:2;}#dpad .pD{grid-column:2;grid-row:3;}#dpad .pR{grid-column:3;grid-row:2;}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#000;}
#view{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}
#objective{position:absolute;left:0;right:0;bottom:12px;text-align:center;pointer-events:none;z-index:20;}
#objective span{display:inline-block;padding:8px 20px;border-radius:12px;font-size:13px;letter-spacing:1px;
  color:#dcebff;background:rgba(8,10,24,.72);border:1px solid rgba(120,190,255,.22);
  box-shadow:0 4px 20px rgba(0,0,0,.5);backdrop-filter:blur(6px);max-width:94%;}
#dock{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:40;}
#dock button{width:46px;height:50px;border-radius:14px;border:1px solid rgba(120,190,255,.3);
  background:rgba(10,14,30,.78);color:#cfdaff;font-size:9.5px;letter-spacing:1px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.05);backdrop-filter:blur(6px);
  transition:transform .12s,background .12s;}
#dock button:hover{transform:translateX(-3px);background:rgba(40,80,160,.55);}
#dock button .ic{font-size:17px;line-height:1;}
#feedbox{position:absolute;right:64px;top:12px;width:252px;z-index:45;display:none;
  background:rgba(10,14,30,.93);border:1px solid rgba(120,190,255,.3);border-radius:16px;padding:14px 15px;
  max-height:82%;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.7);backdrop-filter:blur(10px);}
#feedbox.show{display:block;}
#feedbox h3{margin-bottom:9px;font-size:15px;color:#7bffc0;letter-spacing:1px;}
.group{margin-bottom:10px;}
.group h4{font-size:12px;color:#9fb4ff;margin-bottom:6px;letter-spacing:1px;}
.food{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:6px;border-radius:11px;
  background:rgba(255,255,255,.05);border:1px solid rgba(120,190,255,.2);font-size:13px;cursor:pointer;
  transition:background .15s,transform .1s;}
.food:hover{background:rgba(70,130,230,.25);transform:translateX(2px);}
.food .n{flex:1;}
.food .t{color:#9aa6cc;font-size:11px;}
.red h4{color:#ff9f8a;}
.red .food{border-color:rgba(255,120,100,.4);cursor:not-allowed;opacity:.8;}
.red .food .t{color:#ffb9a8;}
#notifs{position:absolute;right:12px;top:12px;z-index:60;pointer-events:none;display:flex;flex-direction:column;gap:8px;}
.notif{background:rgba(10,14,30,.88);border-left:3px solid var(--nc,#7bffc0);border-radius:10px;
  padding:9px 14px;font-size:13px;color:#e6efff;box-shadow:0 8px 26px rgba(0,0,0,.6);
  backdrop-filter:blur(8px);transform:translateX(120%);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);
  max-width:300px;}
.notif.in{transform:none;}
.notif b{display:block;font-size:14px;}
.notif small{color:#9fb4ff;font-size:11px;}
.ovl{position:fixed;inset:0;background:rgba(4,6,16,.88);backdrop-filter:blur(6px);display:none;flex-direction:column;z-index:80;}
.ovl.show{display:flex;}
.ovl-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  border-bottom:1px solid rgba(120,190,255,.22);background:rgba(8,10,24,.75);}
.ovl-head h2{font-size:16px;letter-spacing:1px;text-shadow:0 0 12px rgba(120,200,255,.5);}
.ovl-close{width:38px;height:38px;border-radius:11px;border:1px solid rgba(120,190,255,.3);
  background:rgba(255,255,255,.06);color:#dfe8ff;font-size:18px;cursor:pointer;}
.ovl-close:hover{background:rgba(255,120,120,.25);}
.ovl-body{flex:1;overflow-y:auto;padding:16px 12px 44px;user-select:text;}
.content{max-width:880px;margin:0 auto;}
.content h1{font-size:21px;margin-bottom:4px;letter-spacing:1px;text-shadow:0 0 14px rgba(120,200,255,.45);}
.content .sub{color:#8fa0cc;font-size:13px;margin-bottom:16px;}
.card{background:rgba(12,16,34,.6);border:1px solid rgba(120,190,255,.2);border-radius:16px;padding:16px 16px 13px;margin-bottom:14px;}
.card h2{font-size:16px;margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid rgba(120,190,255,.2);color:#cfe0ff;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:4px;}
.tbl th,.tbl td{border:1px solid rgba(120,190,255,.18);padding:8px 10px;text-align:left;vertical-align:top;}
.tbl th{background:rgba(120,190,255,.08);font-weight:600;white-space:nowrap;width:120px;color:#aebdff;}
.tag{display:inline-block;background:rgba(80,160,255,.14);color:#9bd6ff;border-radius:20px;padding:3px 12px;font-size:12px;margin:3px 3px 0 0;}
.good{background:rgba(80,255,180,.08);border:1px solid rgba(80,255,180,.35);color:#8ff2c0;border-radius:10px;padding:9px 13px;font-size:13px;margin:8px 0;}
.warn{background:rgba(255,143,122,.08);border:1px solid rgba(255,143,122,.35);color:#ffb9a8;border-radius:10px;padding:9px 13px;font-size:13px;margin:8px 0;}
.list li{margin:5px 0 5px 18px;font-size:13px;}
.btn{border:1px solid rgba(120,190,255,.35);background:rgba(80,150,255,.14);color:#dcebff;padding:9px 18px;border-radius:11px;font-size:13px;cursor:pointer;transition:background .15s;}
.btn:hover{background:rgba(80,150,255,.3);}
.btn.primary{background:linear-gradient(135deg,#2f9bff,#7b5cff);border:none;color:#fff;font-weight:700;box-shadow:0 0 14px rgba(90,140,255,.5);}
.btn.green{background:linear-gradient(135deg,#19c88f,#7bffc0);border:none;color:#05301f;font-weight:800;box-shadow:0 0 14px rgba(80,255,180,.5);}
.btn.danger{border-color:rgba(255,143,122,.4);color:#ffb9a8;background:rgba(255,143,122,.08);}
.photo{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 4px;justify-content:center;}
.slot{width:148px;height:166px;border:2px dashed rgba(120,190,255,.35);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#8fa0cc;font-size:12px;background:rgba(255,255,255,.03);overflow:hidden;}
.slot img{width:100%;height:100%;object-fit:cover;}
.videobox{width:100%;max-width:640px;margin:0 auto;text-align:center;}
.videobox video{width:100%;border-radius:12px;background:#000;max-height:360px;}
.vidph{width:100%;min-height:180px;border:2px dashed rgba(120,190,255,.35);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#8fa0cc;
  background:rgba(255,255,255,.03);font-size:13px;}
.qblock{margin-bottom:13px;padding:11px 13px;background:rgba(255,255,255,.03);border:1px solid rgba(120,190,255,.18);border-radius:12px;}
.qblock .qt{font-size:13.5px;font-weight:600;margin-bottom:8px;line-height:1.5;}
.qblock .qt .core{color:#ff9f8a;font-size:11px;font-weight:700;border:1px solid rgba(255,143,122,.5);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;}
.opt{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:8px;margin:3px 0;background:rgba(255,255,255,.04);font-size:13px;cursor:pointer;border:1px solid transparent;}
.opt:hover{border-color:rgba(120,190,255,.3);}
.opt input{accent-color:#3ec8f0;margin-top:2px;}
.opt .pts{margin-left:auto;color:#8fa0cc;font-size:11px;white-space:nowrap;}
.opt.veto .pts{color:#ff9f8a;}
.qtext{width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(120,190,255,.3);background:rgba(0,0,0,.3);color:#eaf2ff;font-size:13px;font-family:inherit;}
#result{display:none;padding:13px 15px;border-radius:12px;margin-top:4px;font-size:14px;line-height:1.7;}
#result.show{display:block;}
#result.pass{background:rgba(80,255,180,.1);border:1px solid rgba(80,255,180,.4);color:#8ff2c0;}
#result.fail{background:rgba(255,143,122,.1);border:1px solid rgba(255,143,122,.45);color:#ffb9a8;}
#result.review{background:rgba(255,202,107,.08);border:1px solid rgba(255,202,107,.4);color:#ffd98a;}
.contact{border:1px solid rgba(80,255,180,.55)!important;background:rgba(80,255,180,.06)!important;text-align:center;}
.contact h2{color:#7bffc0!important;}
.contact .phone{font-size:24px;font-weight:800;color:#fff;letter-spacing:3px;margin:8px 0;text-shadow:0 0 14px rgba(80,255,180,.5);}
.copycard{margin-bottom:13px;padding:13px 15px;background:rgba(255,255,255,.03);border:1px solid rgba(120,190,255,.2);border-radius:12px;}
.copycard .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.copycard .ch h3{font-size:14px;}
.copycard pre{white-space:pre-wrap;font-family:inherit;font-size:12.5px;line-height:1.8;color:#cdd9ff;background:rgba(0,0,0,.25);padding:12px;border-radius:10px;max-height:360px;overflow-y:auto;}
#ovFollow textarea{width:100%;min-height:42px;padding:7px 9px;border-radius:8px;border:1px solid rgba(120,190,255,.28);background:rgba(0,0,0,.3);color:#eaf2ff;font-size:12.5px;font-family:inherit;resize:vertical;}
.cb{display:flex;align-items:center;gap:8px;font-size:13px;}
.foot{color:#6f86c8;font-size:12px;text-align:center;margin-top:16px;line-height:1.8;}
#intro{position:fixed;inset:0;z-index:120;background:#02030a;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1.2s ease;pointer-events:none;}
#intro.hide{opacity:0;}
#intro .t1{font-size:clamp(26px,6vw,46px);font-weight:800;letter-spacing:8px;
  background:linear-gradient(120deg,#9be8ff,#7b9bff,#c09bff,#7bffc0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(90,160,255,.5);animation:glow 3s infinite;}
#intro .t2{margin-top:14px;font-size:15px;letter-spacing:5px;color:#8fa0cc;}
#intro .t3{margin-top:26px;font-size:12px;letter-spacing:2px;color:#5a6fa0;animation:blink 1.6s infinite;}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 8px rgba(120,190,255,.4));}50%{filter:drop-shadow(0 0 20px rgba(120,190,255,.8));}}
@keyframes blink{0%,100%{opacity:.4;}50%{opacity:1;}}
#flash{position:fixed;inset:0;z-index:110;pointer-events:none;background:radial-gradient(circle,#9be8ff,rgba(120,160,255,0));opacity:0;transition:opacity .6s;}
#flash.on{opacity:.55;}
#guide{position:fixed;z-index:130;left:50%;bottom:26px;transform:translateX(-50%);width:min(680px,92vw);
  background:rgba(30,34,48,.94);border:1px solid rgba(150,190,255,.3);border-radius:16px;padding:16px 20px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);transition:opacity .5s,transform .5s;}
#guide.hide{opacity:0;transform:translateX(-50%) translateY(14px);pointer-events:none;}
#guide .g-name{font-weight:800;font-size:14px;color:#9bd6ff;margin-bottom:4px;}
#guide .g-name b{font-size:17px;}
#guide .g-line{font-size:14px;line-height:1.75;color:#e8efff;min-height:26px;}
#guide .g-line .cur{display:inline-block;width:8px;height:16px;background:#7bffc0;vertical-align:-2px;animation:blink .8s infinite;}
#guide .g-btn{margin-top:10px;text-align:right;}
#guide .g-btn button{background:#7bffc0;color:#0a1f16;border:none;border-radius:999px;padding:8px 22px;font-weight:700;font-size:14px;cursor:pointer;}
#guide .g-btn button:hover{filter:brightness(1.08);}
#guide .g-btn button:disabled{opacity:.4;cursor:default;}
</style>
</head>
<body tabindex="0">
<div id="wrap">
  <header id="appbar">
    <div class="brand"><span class="logo">🐾</span>
      <span class="t">小八 · 领养守护官<small>森林木屋版</small></span></div>
    <div id="hud">
      <div id="affinity">
        <div class="row"><span class="lbl">好感</span><span class="val" id="affVal">0/100</span><span class="lv" id="affLv">Lv1 初识友好</span></div>
        <div class="bar"><i id="affBar"></i></div>
      </div>
      <button id="keyBtn" onclick="toggleKeyMode()" title="键盘控制小八移动">⌨️ WASD</button>
      <button id="aud" onclick="toggleAudio()">🔊</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="view"></canvas>
    <div id="feedbox">
      <h3>🍚 猫粮喂食台</h3>
      <div class="group"><h4>🍖 主食 · 固定喂养</h4>
        <div class="food" data-key="dry"><span class="n">成/幼猫粮</span><span class="t">粗蛋白≥38% · 50-60g/天</span></div></div>
      <div class="group"><h4>🥗 安全辅食</h4>
        <div class="food" data-key="chicken"><span class="n">水煮鸡胸肉</span><span class="t">去骨去盐 · 优质加分</span></div>
        <div class="food" data-key="milk"><span class="n">无乳糖羊奶粉</span><span class="t">适合幼猫 · 优质加分</span></div></div>
      <div class="group red"><h4>🚫 禁食黑名单</h4>
        <div class="food"><span class="n">葱蒜/葡萄/巧克力</span><span class="t">有毒，严禁投喂</span></div>
        <div class="food"><span class="n">重油重盐人类饭菜</span><span class="t">高油高盐，危险</span></div></div>
    </div>
    <div id="dock">
      <button data-open="Profile" title="档案"><span class="ic">📋</span>档案</button>
      <button data-open="Show" title="展示"><span class="ic">🖼</span>展示</button>
      <button data-open="Survey" title="问卷"><span class="ic">📝</span>问卷</button>
      <button data-open="Copy" title="文案"><span class="ic">✍️</span>文案</button>
      <button data-open="Follow" title="回访"><span class="ic">🔍</span>回访</button>
    </div>
    <div id="notifs"></div>
    <div id="objective"><span id="objectiveTxt">🐾 小八的森林木屋 · 点击地面或物件陪它</span></div>
  </div>
</div>

<div id="wasdHint">⌨️ 键盘：WASD / 方向键 ｜ 触屏：点下方方向键</div>
<div id="dpad" class="show">
  <button class="pU" data-k="w">▲</button>
  <button class="pL" data-k="a">◀</button>
  <button class="pD" data-k="s">▼</button>
  <button class="pR" data-k="d">▶</button>
</div>
<div id="flash"></div>
<div id="intro">
  <div class="t1">小 八</div>
  <div class="t2">领 养 守 护 官</div>
  <div class="t3" id="introTip">点击屏幕任意处 让我陪你看完这份小指南</div>
</div>

<div id="guide" class="hide">
  <div class="g-name">🐱 我是小八 · 这份小指南带你认识这个家</div>
  <div class="g-line" id="guideLine"></div>
  <div class="g-btn"><button id="guideBtn" onclick="guideNext()">开始 →</button></div>
</div>

<script>
"use strict";
/* ===================== 工具 ===================== */
const ui=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const W=1280,H=760,FLOOR_TOP=318;
let SCL=1;
let DPR=window.devicePixelRatio||1;
let ZOOM=2;  // 高清倍率：2 倍超采样，画面更锐利
function fit(){
  const st=ui("stage"),rw=st.clientWidth,rh=st.clientHeight;
  SCL=Math.min(rw/W,rh/H);
  const v=ui("view");
  v.width=Math.max(2,Math.round(W*SCL*ZOOM));
  v.height=Math.max(2,Math.round(H*SCL*ZOOM));
  CTX.setTransform(SCL*ZOOM,0,0,SCL*ZOOM,0,0);
}
const view=ui("view"),CTX=view.getContext("2d");
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
let __tt;
function notif(title,color,sub){
  const box=ui("notifs");
  const d=document.createElement("div");d.className="notif";
  if(color)d.style.setProperty("--nc",color);
  d.innerHTML="<b>"+title+"</b>"+(sub?"<small>"+sub+"</small>":"");
  box.appendChild(d);
  requestAnimationFrame(()=>d.classList.add("in"));

let AC=null,muted=false;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){}}
function toggleAudio(){muted=!muted;ui("aud").classList.toggle("off",muted);ui("aud").textContent=muted?"🔇":"🔊";if(!muted)initAudio();}
function tone(f0,f1,dur,type,vol,delay){
  if(muted||!AC)return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f0,t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol||0.12,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+0.05);
}

function perspX(y){return lerp(0.60,1.06,Math.pow(y,1.2));}
function syOf(y){return FLOOR_TOP+(H-FLOOR_TOP)*Math.pow(y,1.5);}
function scaleOf(y){return lerp(0.68,1.45,y);}
function project(x,y){return {x:W/2+(x-0.5)*W*perspX(y), y:syOf(y), s:scaleOf(y)};}
function unproject(sx,sy){
  const y=Math.max(0.02,Math.pow((sy-FLOOR_TOP)/(H-FLOOR_TOP),1/1.5));
  const x=(sx-W/2)/(W*perspX(y))+0.5;
  return {x,y};
}

/* ===================== 小八（圆润卡通奶牛小猫） ===================== */
function poseFor(){
  const stt=st.cat.state,an=st.cat.anim;
  const P={bodyX:0,bodyY:-16,bob:0,tilt:0,legs:[0,0],
    headX:2.5,headY:-37,headR:14,headTilt:0,
    tail:-0.6,closed:false,lie:false,down:false,pawUp:false};
  if(stt==="walk"){P.bob=Math.abs(Math.sin(an*9))*2.4;P.legs=[Math.sin(an*9)*6,Math.sin(an*9+Math.PI)*6];
    P.tilt=Math.sin(an*9)*0.05;P.tail=-1.3+Math.sin(an*7)*0.35;P.headX=2.5;}
  else if(stt==="eat"){P.headY=-33;P.headTilt=0.14;P.tail=-0.5;P.headX=3;}
  else if(stt==="poop"){P.legs=[5,-5];P.tail=-1.8;P.bodyY=-13;P.headX=2;}
  else if(stt==="sleep"){P.lie=true;P.closed=true;P.tail=0.1;}
  else if(stt==="sit"){P.legs=[0,0];P.bodyY=-19;P.tail=0.9;P.headX=2;}
  else if(stt==="play"){P.bodyY=-11;P.tail=-2;P.down=true;P.headX=3;}
  else if(stt==="hand"){P.pawUp=true;P.tail=1.3;P.headX=2;}
  else if(stt==="cuddle"){P.headTilt=0.3;P.tail=1.5;P.headX=4;P.headY=-35;}
  else if(stt==="tv"){P.legs=[0,0];P.bodyY=-18;P.headTilt=0.12;P.tail=0.6;P.headX=4;}
  else if(stt==="bag"){P.legs=[0,0];P.bodyY=-15;P.headX=3;}
  else if(stt==="idle"){P.tail=Math.sin(performance.now()/700)*0.2;P.headX=2;}
  if(st.cat.blink>0){P.closed=true;}
  return P;
}
function bobExtra(p){return p.bob*(p.lie?0.3:1);}
function catPath(P){
  const PX=CTX,ts=performance.now()/1000;

  // 身体（圆胖+渐变+背斑+白肚）
  PX.save();PX.translate(bodyX,bodyY);PX.rotate(P.tilt);
  const bg=PX.createRadialGradient(-6,-8,4,0,0,26);
  bg.addColorStop(0,"#fdfbf8");bg.addColorStop(1,SHADE);
  PX.fillStyle=bg;PX.beginPath();PX.ellipse(0,0,23,17,0,0,Math.PI*2);PX.fill();
  // 奶牛斑：背部主斑 + 后臀斑 + 小碎斑
  PX.fillStyle=BLACK;PX.beginPath();PX.ellipse(0,-5,10,6,0.2,0,Math.PI*2);PX.fill();
  PX.fillStyle=BLACK;PX.beginPath();PX.ellipse(-10,2,5,4,0.3,0,Math.PI*2);PX.fill();
  PX.fillStyle=BLACK;PX.beginPath();PX.arc(7,-6,3,0,Math.PI*2);PX.fill();
  PX.fillStyle="rgba(255,255,255,.55)";PX.beginPath();PX.ellipse(-1,7,13,7,0,0,Math.PI*2);PX.fill();
  PX.restore();
  // 前腿（白，圆掌）
  for(let i=0;i<2;i++){
    const s=(i===0?P.legs[0]:P.legs[1])*0.5,lx=9+i*4;
    if(P.pawUp&&i===0){
      PX.strokeStyle=WHITE;PX.lineWidth=10;
      PX.beginPath();PX.moveTo(lx,bodyY+4);PX.lineTo(lx+8,bodyY-8);PX.stroke();
      PX.fillStyle=BLACK;PX.beginPath();PX.ellipse(lx+8,bodyY-8,6,5,0,0,Math.PI*2);PX.fill();
    }else{
      PX.strokeStyle=WHITE;PX.lineWidth=11;
      PX.beginPath();PX.moveTo(lx,bodyY+5);PX.lineTo(lx+s,bodyY+15);PX.stroke();
      PX.fillStyle="#f2efe9";PX.beginPath();PX.ellipse(lx+s,bodyY+15,6,4.5,0,0,Math.PI*2);PX.fill();
      PX.strokeStyle="rgba(40,40,50,.22)";PX.lineWidth=1;
      PX.beginPath();PX.arc(lx+s,bodyY+15,4,0,Math.PI*2);PX.stroke();
    }
  }
  // 头
  const hx=P.headX,hy=P.headY,R=P.headR;
  // 耳朵（黑外粉内，在头后）
  for(const s of[-1,1]){
    const ex=hx+s*R*0.45,ey=hy-R*0.7;
    PX.fillStyle=BLACK;
    PX.beginPath();
    PX.moveTo(ex-s*5,ey);
    PX.quadraticCurveTo(ex,ey-R*1.2,ex+s*13,ey-R*0.95);
    PX.quadraticCurveTo(ex+s*9,ey-R*0.4,ex+s*8,ey);
    PX.closePath();PX.fill();
    PX.fillStyle=PINK;
    PX.beginPath();
    PX.moveTo(ex-s*2,ey+1);
    PX.quadraticCurveTo(ex,ey-R*0.85,ex+s*8,ey-R*0.65);
    PX.quadraticCurveTo(ex+s*5,ey-R*0.35,ex+s*3,ey+1);
    PX.closePath();PX.fill();
  }
  // 头（渐变圆）
  const hg=PX.createRadialGradient(hx-4,hy-4,3,hx,hy,16);
  hg.addColorStop(0,"#fdfbf8");hg.addColorStop(1,SHADE);
  PX.fillStyle=hg;PX.beginPath();PX.arc(hx,hy,R,0,Math.PI*2);PX.fill();
  // 对称「八字脸」：黑色八字斑在眼睛上方和两侧（像刘海），中间白色中分，眼睛下方脸颊白色
  PX.fillStyle=BLACK;
  // 左八字（眼睛上方）
  PX.beginPath();
  PX.moveTo(hx-R,hy-R*0.2);
  PX.quadraticCurveTo(hx-R*1.05,hy-R*0.92,hx-R*0.55,hy-R*1.0);
  PX.quadraticCurveTo(hx-R*0.3,hy-R*1.0,hx-R*0.34,hy-R*0.42);
  PX.quadraticCurveTo(hx-R*0.32,hy-R*0.12,hx-R*0.3,hy-R*0.0);
  PX.quadraticCurveTo(hx-R*0.42,hy+0.5,hx-R*0.6,hy+0.55);
  PX.quadraticCurveTo(hx-R*0.9,hy+0.45,hx-R*0.98,hy-R*0.2);
  PX.closePath();PX.fill();
  // 右八字（眼睛上方）
  PX.beginPath();
  PX.moveTo(hx+R,hy-R*0.2);
  PX.quadraticCurveTo(hx+R*1.05,hy-R*0.92,hx+R*0.55,hy-R*1.0);
  PX.quadraticCurveTo(hx+R*0.3,hy-R*1.0,hx+R*0.34,hy-R*0.42);
  PX.quadraticCurveTo(hx+R*0.32,hy-R*0.12,hx+R*0.3,hy-R*0.0);
  PX.quadraticCurveTo(hx+R*0.42,hy+0.5,hx+R*0.6,hy+0.55);
  PX.quadraticCurveTo(hx+R*0.9,hy+0.45,hx+R*0.98,hy-R*0.2);
  PX.closePath();PX.fill();
  // 眼睛（两只大眼+高光）
  const eyeY=hy+1.5,eyeDX=R*0.42,eyeR=4.2;
  PX.save();PX.rotate(P.headTilt);
  for(const s of[-1,1]){
    const ex=hx+s*eyeDX;
    if(P.closed){
      PX.strokeStyle=BLACK;PX.lineWidth=2.2;PX.lineCap="round";
      PX.beginPath();PX.arc(ex,eyeY,eyeR,0.2,Math.PI-0.2);PX.stroke();
    }else{
      PX.fillStyle="#fff";PX.beginPath();PX.ellipse(ex,eyeY,eyeR,eyeR*1.12,0,0,Math.PI*2);PX.fill();
      PX.fillStyle="#c9b45c";PX.beginPath();PX.arc(ex,eyeY+0.4,3.1,0,Math.PI*2);PX.fill();
      PX.fillStyle="#1f2b1f";PX.beginPath();PX.arc(ex+0.4,eyeY+0.6,1.8,0,Math.PI*2);PX.fill();
      PX.fillStyle="#fff";PX.beginPath();PX.arc(ex-1.3,eyeY-1.2,1.5,0,Math.PI*2);PX.fill();
      PX.fillStyle="rgba(255,255,255,.7)";PX.beginPath();PX.arc(ex+1.1,eyeY+1.3,0.7,0,Math.PI*2);PX.fill();
      // 黑色眼线：上下各一条细弧
      PX.strokeStyle="rgba(20,20,30,.9)";PX.lineWidth=1.2;PX.lineCap="round";
      PX.beginPath();PX.ellipse(ex,eyeY-0.3,eyeR*1.06,eyeR*1.28,0,Math.PI*1.12,Math.PI*1.88);PX.stroke();
      PX.beginPath();PX.ellipse(ex,eyeY+0.2,eyeR*1.02,eyeR*1.2,0,Math.PI*0.12,Math.PI*0.88);PX.stroke();
    }
  }
  PX.restore();
  // 鼻+嘴（精致倒三角粉鼻）
  PX.fillStyle="#f87fa5";
  PX.beginPath();PX.moveTo(hx-2.1,hy+4);PX.lineTo(hx+2.1,hy+4);PX.lineTo(hx,hy+6.2);PX.closePath();PX.fill();
  PX.strokeStyle=BLACK;PX.lineWidth=1.3;PX.lineCap="round";
  PX.beginPath();PX.moveTo(hx,hy+6.6);PX.lineTo(hx,hy+8);PX.stroke();
  PX.beginPath();PX.moveTo(hx,hy+8);PX.quadraticCurveTo(hx-2.6,hy+10.4,hx-5,hy+8);PX.stroke();
  PX.beginPath();PX.moveTo(hx,hy+8);PX.quadraticCurveTo(hx+2.6,hy+10.4,hx+5,hy+8);PX.stroke();
  // 胡须
  PX.strokeStyle="rgba(70,70,85,.5)";PX.lineWidth=1.1;
  for(let i=0;i<2;i++){
    PX.beginPath();PX.moveTo(hx-8,hy+(i?7:4));PX.lineTo(hx-19,hy+(i?9:5));PX.stroke();
    PX.beginPath();PX.moveTo(hx+8,hy+(i?7:4));PX.lineTo(hx+19,hy+(i?9:5));PX.stroke();
  }
  // 项圈
  PX.strokeStyle="#3ec8f0";PX.lineWidth=3.4;
  PX.beginPath();PX.arc(hx,hy+9,8.5,0.3*Math.PI,0.7*Math.PI);PX.stroke();
  PX.fillStyle="#ffca6b";PX.beginPath();PX.arc(hx,hy+11,3,0,Math.PI*2);PX.fill();
}
function catLie(P){
  const PX=CTX,ts=performance.now()/1000;
  const BLACK="#1c1e26",WHITE="#f6f4f0",SHADE="#e3ded6",PINK="#f4a9c0";
  const cx=P.bodyX,cy=P.bodyY+6;
  // 蜷尾
  PX.strokeStyle=BLACK;PX.lineWidth=9;PX.lineCap="round";
  PX.beginPath();PX.moveTo(cx-24,cy-2);
  PX.quadraticCurveTo(cx-40,cy-6+Math.sin(ts)*2,cx-38,cy+8);PX.stroke();
  PX.fillStyle=BLACK;PX.beginPath();PX.arc(cx-38,cy+8,5,0,Math.PI*2);PX.fill();
  // 身体面包卷
  const bg=PX.createRadialGradient(cx-8,cy-8,4,cx,cy,26);
  bg.addColorStop(0,"#fbf9f5");bg.addColorStop(1,SHADE);
  PX.fillStyle=bg;rr(PX,cx-26,cy-14,52,20,12);PX.fill();
  PX.fillStyle=BLACK;rr(PX,cx-20,cy-12,20,11,7);PX.fill();
  // 头
  const hx=cx+14,hy=cy-8,R=13;
  const hg=PX.createRadialGradient(hx-4,hy-4,3,hx,hy,16);
  hg.addColorStop(0,"#fdfbf8");hg.addColorStop(1,SHADE);
  PX.fillStyle=hg;PX.beginPath();PX.arc(hx,hy,R,0,Math.PI*2);PX.fill();
  // 八字脸（黑斑在眼睛上方和两侧，中间白中分）
  PX.fillStyle=BLACK;
  PX.beginPath();
  PX.moveTo(hx-R,hy-R*0.15);
  PX.quadraticCurveTo(hx-R*1.02,hy-R*0.88,hx-R*0.55,hy-R*0.95);
  PX.quadraticCurveTo(hx-R*0.32,hy-R*0.96,hx-R*0.36,hy-R*0.4);
  PX.quadraticCurveTo(hx-R*0.34,hy-R*0.1,hx-R*0.32,hy-R*0.0);
  PX.quadraticCurveTo(hx-R*0.44,hy+0.5,hx-R*0.6,hy+0.55);
  PX.quadraticCurveTo(hx-R*0.9,hy+0.45,hx-R*0.98,hy-R*0.15);
  PX.closePath();PX.fill();
  PX.beginPath();
  PX.moveTo(hx+R,hy-R*0.15);
  PX.quadraticCurveTo(hx+R*1.02,hy-R*0.88,hx+R*0.55,hy-R*0.95);
  PX.quadraticCurveTo(hx+R*0.32,hy-R*0.96,hx+R*0.36,hy-R*0.4);
  PX.quadraticCurveTo(hx+R*0.34,hy-R*0.1,hx+R*0.32,hy-R*0.0);
  PX.quadraticCurveTo(hx+R*0.44,hy+0.5,hx+R*0.6,hy+0.55);
  PX.quadraticCurveTo(hx+R*0.9,hy+0.45,hx+R*0.98,hy-R*0.15);
  PX.closePath();PX.fill();
  // 耳
  for(const s of[-1,1]){
    PX.fillStyle=BLACK;
    PX.beginPath();PX.moveTo(hx+s*R*0.5,hy-R*0.8);PX.lineTo(hx+s*R*1.2,hy-R-6);PX.lineTo(hx+s*R*1.3,hy-R*0.2);PX.closePath();PX.fill();
    PX.fillStyle=PINK;
    PX.beginPath();PX.moveTo(hx+s*R*0.6,hy-R*0.6);PX.lineTo(hx+s*R*1.05,hy-R-3.5);PX.lineTo(hx+s*R*1.1,hy-R*0.4);PX.closePath();PX.fill();
  }
  // 闭眼
  PX.strokeStyle=BLACK;PX.lineWidth=2;PX.lineCap="round";
  for(const s of[-1,1]){PX.beginPath();PX.arc(hx+s*R*0.42,hy-1,4,0.2,Math.PI-0.2);PX.stroke();}
  // 鼻
  PX.fillStyle="#f87fa5";
  PX.beginPath();PX.moveTo(hx-1.9,hy+2);PX.lineTo(hx+1.9,hy+2);PX.lineTo(hx,hy+4);PX.closePath();PX.fill();
}
function catPos(){return project(st.cat.x,st.cat.y);}
function drawCat(){
  const p=catPos(),P=poseFor();
  // 柔软落地阴影（贴合猫大小）
  CTX.save();
  CTX.translate(p.x,p.y+2*p.s);
  const sg=CTX.createRadialGradient(0,0,0,0,0,30*p.s);
  sg.addColorStop(0,"rgba(0,0,0,.22)");sg.addColorStop(1,"rgba(0,0,0,0)");
  CTX.fillStyle=sg;
  CTX.beginPath();CTX.ellipse(0,0,26*p.s,6*p.s,0,0,Math.PI*2);CTX.fill();
  CTX.restore();
  CTX.save();CTX.translate(p.x,p.y);CTX.scale(st.cat.face*p.s,p.s);
  catPath(P);
  CTX.restore();
}
function drawCatReflect(){
  const p=catPos(),P=poseFor();
  CTX.save();CTX.translate(p.x,p.y);CTX.scale(st.cat.face*p.s,-p.s);
  CTX.globalAlpha=0.12;catPath(P);
  CTX.globalAlpha=1;CTX.restore();
}

function anyOverlay(){return ["Profile","Show","Survey","Copy","Follow"].some(o=>ui("ov"+o).classList.contains("show"));}
function zoneCenter(k){const z=ZONE[k];return {x:z.x+z.w/2,y:z.y+z.h/2};}
function startAction(mode,target){
  stopAction();
  st.mode=mode;st.target=target;st.walking=true;st.cat.state="walk";st.noticeShown=false;
}
function stopAction(){
  st.mode=null;st.target=null;st.walking=false;st.pendingFood=null;
  if(st.cat.state!=="idle")st.cat.state="idle";
}
function walkTo(x,y){
  if(y<WALKMIN||y>WALKMAX)return;
  stopAction();
  st.target={x:clamp(x,WMARGIN,1-WMARGIN),y:clamp(y,WALKMIN,WALKMAX)};
  st.walking=true;st.cat.state="walk";
}
function orderFood(key){
  const f=FOODS[key];if(!f)return;
  ui("feedbox").classList.remove("show");
  st.pendingFood=f;
  const c=zoneCenter("FEED");
  startAction("feed",{x:c.x+0.02,y:c.y});
  notif("🍚 "+f.n,"#7bffc0",f.type==="snack"?"优质辅食，加分更高":"主食 · 粗蛋白≥38%");
  sfx.click();
}
function startToilet(){const c=zoneCenter("LITTER");startAction("toilet",{x:c.x,y:c.y});notif("🧻 小八前往定点如厕","#9bd6ff");}
function startPlay(){const c=zoneCenter("TOYS");startAction("play",{x:c.x+0.03,y:c.y});notif("🧸 小八去玩具区啦","#ffca6b");}
function startSleep(){
  const b=zoneCenter("BED"),a=zoneCenter("BALC");
  const toBed=Math.hypot(st.cat.x-b.x,st.cat.y-b.y)<Math.hypot(st.cat.x-a.x,st.cat.y-a.y);
  startAction("sleep",{x:toBed?b.x:a.x,y:toBed?b.y:a.y});
  notif(toBed?"🛏 小八钻进精致大床":"🌙 小八在飘窗软座看夜景入眠","#9bd6ff");
  sfx.sleep();
}

function floaty(txt,color){
  if(st.floats.length<8){const p=catPos();st.floats.push({x:p.x,y:p.y-30,t:0,text:txt,color:color||"#fff"});}

function spark(x,y,c){st.parts.push({x,y,vx:rand(-2,2),vy:rand(-3,-0.5),t:0,c});}
function bubble(txt,color){st.bubble=txt;st.bubbleT=0;st.bubbleColor=color||"#fff";}
function onTap(sx,sy){
  initAudio();
  if(anyOverlay())return;
  if(sy<FLOOR_TOP){
    if(sx>DOOR.x1&&sx<DOOR.x2&&sy>DOOR.y1){notif("🚪 外面是森林，但小八还没打疫苗，不能随意出门哦","#ffca6b");sfx.click();}
    return;
  }
  const w=unproject(sx,sy);
  if(st.poop&&Math.hypot(w.x-st.poop.x,w.y-st.poop.y)<0.07){cleanPoop();return;}
  for(const k of ZKEYS){
    const z=ZONE[k];
    if(w.x>z.x&&w.x<z.x+z.w&&w.y>z.y&&w.y<z.y+z.h){
      if(k==="FEED"){openFeed();}
      else if(k==="LITTER")startToilet();
      else if(k==="TOYS")startPlay();
      else if(k==="BED"||k==="BALC")startSleep();
      else if(k==="TV")startTV();
      else if(k==="BAG")startBag();
      return;
    }
  }
  const dc=Math.hypot(w.x-st.cat.x,w.y-st.cat.y);
  if(dc<0.06){
    // 点击小八：打开展示页并自动播放视频，同时提升好感
    openShowVideo();
    if(st.lv>=3){st.cat.face=w.x>st.cat.x?1:-1;startAction("cuddle",{x:st.cat.x,y:st.cat.y});notif("🥰 小八贴贴撒娇","#ff9f8a");}
    else if(st.lv>=2){startAction("hand",{x:st.cat.x,y:st.cat.y});notif("🐾 小八等你伸出手","#7bffc0");}
    else pet();
    return;
  }
  walkTo(w.x,w.y);
}
function openShowVideo(){

  sfx.tv();
}

let downX=0,downY=0,moved=false;
view.addEventListener("pointerdown",e=>{downX=e.clientX;downY=e.clientY;moved=false;});
view.addEventListener("pointermove",e=>{
  if(!moved&&Math.hypot(e.clientX-downX,e.clientY-downY)>8)moved=true;
  if(!moved){
    const r=view.getBoundingClientRect();
    const w=unproject((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);
    let found=false;
    for(const k of ZKEYS){const z=ZONE[k];if(w.x>z.x&&w.x<z.x+z.w&&w.y>z.y&&w.y<z.y+z.h){found=true;break;}}
    view.style.cursor=found?"pointer":(w.y>0.33&&w.x>0.04&&w.x<0.96?"pointer":"crosshair");
  }});
view.addEventListener("pointerup",e=>{
  if(moved)return;
  const r=view.getBoundingClientRect();
  onTap((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);
});
window.addEventListener("resize",fit);
/* —— WASD / 方向键 控制小八移动 —— */
const KEYMAP={"w":"w","a":"a","s":"s","d":"d","arrowup":"ArrowUp","arrowdown":"ArrowDown","arrowleft":"ArrowLeft","arrowright":"ArrowRight"};
window.addEventListener("keydown",e=>{
  const k=KEYMAP[(e.key||"").toLowerCase()];
  if(!k)return;
  e.preventDefault();
  st.keys=[...new Set([...st.keys,k])];
  st.keyMode=true;
  if(st.mode)stopAction();
});
window.addEventListener("keyup",e=>{
  const k=KEYMAP[(e.key||"").toLowerCase()];
  if(!k)return;
  e.preventDefault();
  st.keys=st.keys.filter(x=>x!==k);
  if(st.keys.length===0)st.keyMode=false;
});
function toggleKeyMode(){
  st.keys=[];
  st.keyMode=!st.keyMode;
  const b=ui("keyBtn");
  if(b){b.classList.toggle("on",st.keyMode);b.textContent=st.keyMode?"⌨️ WASD ✓":"⌨️ WASD";}
  const h=ui("wasdHint");
  if(h)h.classList.toggle("hide",!st.keyMode);
  notif(st.keyMode?"⌨️ 键盘控制已开启：WASD / 方向键移动小八":"🖱 已切回点击控制", st.keyMode?"#7bffc0":"#9bd6ff");

(function(){

    btn.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();try{btn.setPointerCapture(e.pointerId);}catch(_){}addKey(k);});
    btn.addEventListener("pointerup",e=>{e.preventDefault();e.stopPropagation();delKey(k);});

    btn.addEventListener("mouseleave",()=>delKey(k));
    btn.addEventListener("touchstart",e=>{e.preventDefault();e.stopPropagation();addKey(k);},{passive:false});
    btn.addEventListener("touchend",e=>{e.preventDefault();e.stopPropagation();delKey(k);},{passive:false});

})();

function update(dt,t){
  const o=st.cat;o.anim+=dt;

    if(st.keys.includes("s")||st.keys.includes("ArrowDown"))dy+=1;
    if(st.keys.includes("a")||st.keys.includes("ArrowLeft"))dx-=1;
    if(st.keys.includes("d")||st.keys.includes("ArrowRight"))dx+=1;

  d.innerHTML='<div class="ovl-head"><h2>'+title+'</h2><button class="ovl-close">✕</button></div><div class="ovl-body"><div class="content">'+body+'</div></div>';

  document.body.appendChild(d);
}

let guideStep=0,guideTimer=null;
function typeGuide(){
  const line=ui("guideLine"),cur=document.createElement("span");cur.className="cur";
  const full=GUIDE[guideStep].t,btn=ui("guideBtn");
  btn.style.display="none";
  line.innerHTML="";
  let i=0;
  function tick(){
    if(i<=full.length){
      line.innerHTML=full.slice(0,i);
      line.appendChild(cur);
      i++;
      guideTimer=setTimeout(tick,26);
    }else{btn.style.display="";btn.textContent=guideStep===GUIDE.length-1?"进入木屋 🏠":"下一条 →";}
  }
  tick();
}
function guideNext(){
  if(guideTimer){clearTimeout(guideTimer);guideTimer=null;}
  if(guideStep<GUIDE.length-1){guideStep++;ui("guide").querySelector(".g-name").innerHTML="🐱 "+GUIDE[guideStep].name;typeGuide();}
  else{dismissGuide();}
}
function dismissGuide(){
  const g=ui("guide");g.classList.add("hide");
  setTimeout(()=>{g.style.display="none";},500);
  st.guideDone=true;
}
setTimeout(()=>notif("🐾 欢迎来到小八的森林木屋","#7bffc0","点击屏幕任意处开始小指南"),800);
setTimeout(()=>{
  const n=ui("intro");n.classList.add("hide");
  setTimeout(()=>n.style.display="none",1300);
  ui("guide").classList.remove("hide");
  ui("guide").querySelector(".g-name").innerHTML="🐱 "+GUIDE[0].name;
  typeGuide();
},2600);
function beginGuide(){if(!st.guideDone){const n=ui("intro");if(n&&n.style.display!=="none"){n.classList.add("hide");setTimeout(()=>n.style.display="none",1300);}}
  const g=ui("guide");if(st.guideDone||g.style.display==="none")return;
  ui("guide").classList.remove("hide");typeGuide();}
let lastT=0;
requestAnimationFrame(function loop(now){
  const dt=Math.min(0.05,(now-lastT||now)/1000);lastT=now;
  update(dt,now/1000);
  draw();
  requestAnimationFrame(loop);
});
